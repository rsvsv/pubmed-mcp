name: Offline regression

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10 # 本项目自订：单个作业超时分钟数
    defaults:
      run:
        shell: bash # Windows 上默认是 pwsh，"$MCP_SPEC" 会被当成 pwsh 变量而非环境变量
    strategy:
      fail-fast: false
      matrix:
        os: ['ubuntu-latest', 'windows-latest'] # 1.4.5：Windows 专属分支（不覆盖发布、UTF-16/BOM key、改码页）此前无自动覆盖
        python: ['3.10', '3.13'] # 本项目自订：覆盖声明的 Python 下界及开发版本
        sdk: ['mcp>=1.26,<2', 'mcp>=2,<3'] # 本项目自订：分代解析兼容依赖；不代表覆盖所有版本
    name: ${{ matrix.os }} / Python ${{ matrix.python }} / ${{ matrix.sdk }}
    env:
      MCP_SPEC: ${{ matrix.sdk }}
      NCBI_API_KEY: ''
      NCBI_EMAIL: ''
    steps:
      - uses: actions/checkout@v4 # 本项目自订：Action 主版本
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5 # 本项目自订：Action 主版本
        with:
          python-version: ${{ matrix.python }}
      - name: Install package and selected SDK
        run: python -m pip install . "$MCP_SPEC"
      - name: Check dependency consistency
        run: python -m pip check
      - name: Offline regressions
        run: python -I tests/run_offline.py
      - name: Installed CLI and fresh stdio
        run: python -I tests/smoke_installed.py
